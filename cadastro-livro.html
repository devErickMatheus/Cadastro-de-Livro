<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Referências Bibliográficas</title>
</head>

<body>



    <main>

        <header>
            <h2>Cadastro de Referências Bibliográficas</h2>
            <p>Cadastre os livros recomendados para as disciplinas.</p>
            <hr>
        </header>

        <section>
            <h2>Cadastro de Livro</h2>

            <form action="/salvar-livro" method="post">

                <fieldset>
                    <legend>Informações da Obra</legend>

                    <label for="titulo">Titulo:</label>
                    <input type="text" name="titulo" id="titulo" required>
                    <br>

                    <label for="autor">Autor(es):</label>
                    <input type="text" name="autor" id="autor" required>

                    <br>

                    <label for="isbn">ISBN (13 dig.):</label>
                    <input type="text" name="isbn" id="isbn" placeholder="Ex: 9786555250008" pattern="[0-9]{13}"
                        minlength="13" maxlength="13" required>

                    <br>
                    <label for="Ano_publicacao">Ano de Publicação:</label>
                    <input type="text" name="Ano_Publicacao" id="Ano_Publicacao" minlength="4" maxlength="4"
                        required>
                    <small>(Ex: 2023)</small>


                </fieldset>

                <fieldset>
                    <legend>Detalhes Acadêmicos</legend>

                    <label for="curso">Curso Alvo:</label>

                    <select name="curso" id="curso">
                        <option value="">Selecione o curso...</option>
                        <option value="ads">Análise e Desenvolvimento de Sistemas</option>
                        <option value="medicina">Medicina</option>
                    </select>

                    <br>

                    <label for="disciplinas">Disciplinas:</label>
                    <input type="text" name="disciplinas" id="disciplinas" required>

                    <br>
                    <span>Formato:</span>

                    <input type="radio" id="fisico" name="formato" value="fisico" required>
                    <label for="fisico">Físico</label>

                    <input type="radio" id="digital" name="formato" value="digital">
                    <label for="digital">Digital</label>

                    <input type="radio" id="ambos" name="formato" value="ambos">
                    <label for="ambos">Ambos</label>


                </fieldset>


                <button type="submit">Salvar Livro</button>
            </form>
        </section>
    </main>

</body>

</html>
